---
- name: Get dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Ensure APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configure Docker APT repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
  register: docker_repo

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Add approved users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Install NVIDIA Container Toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Configure NVIDIA Container Toolkit APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nvidia-container-toolkit.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH)
      Suites: /
      Signed-By: /etc/apt/keyrings/nvidia-container-toolkit.asc
  register: nvidia_toolkit_repo

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: "{{ nvidia_toolkit_repo is changed }}"

- name: Read Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_config
  failed_when: false
  changed_when: false

- name: Configure NVIDIA runtime for Docker
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk_configure
  when: >-
    docker_daemon_config.content is not defined or
    'nvidia-container-runtime' not in (docker_daemon_config.content | b64decode)
  changed_when: true
  notify: Restart Docker

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Apply Docker runtime configuration now
  ansible.builtin.meta: flush_handlers

- name: Verify GPU access from a container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --gpus
      - all
      - ubuntu:24.04
      - nvidia-smi
  changed_when: false

